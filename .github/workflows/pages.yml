name: Deploy product website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - examples/quotes-toscrape-report.html
      - .github/workflows/pages.yml
      - docs/site/**
      - scripts/prepare-pages.mjs
      - scripts/qa/check-production-security.sh
      - packages/cli/bundle/cli.js
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare product website and example reports
        run: node scripts/prepare-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  security-smoke:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check production Pages responses
        run: bash scripts/qa/check-production-security.sh
